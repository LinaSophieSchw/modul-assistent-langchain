<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="585" viewBox="0 0 1000 585" role="img" aria-labelledby="title desc">
  <title id="title">Ein Agent entscheidet nach jedem Werkzeugergebnis erneut</title>
  <desc id="desc">Frage und Verlauf gehen an das BFH-Modell. Das Modell wählt modul_suche oder lernzeit. Der Executor führt das Werkzeug aus. Sein echtes Ergebnis geht als Observation zurück an das Modell. Das Modell kann ein weiteres Werkzeug wählen oder mit Antwort oder Rückfrage abschliessen.</desc>
  <defs><marker id="pfeil" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#53677e"/></marker></defs>
  <rect width="1000" height="585" fill="white"/>
  <g font-family="DejaVu Sans, Arial, sans-serif" fill="#172536">
    <text x="22" y="36" font-size="22" font-weight="bold">Ein Agent wählt zwischen Suche und Rechner</text>
    <text x="600" y="84" text-anchor="middle" font-size="16" fill="#53677e">Mit dem Werkzeugergebnis erneut an das Modell</text>
    <g fill="none" stroke="#53677e" stroke-width="2" marker-end="url(#pfeil)">
      <path d="M180 300 H217"/>
      <path d="M420 282 L477 213"/>
      <path d="M420 318 L477 418"/>
      <path d="M710 210 L767 282"/>
      <path d="M710 420 L767 318"/>
      <path d="M872 260 V108 H320 V257"/>
      <path d="M320 340 V477"/>
    </g>
    <g stroke="#738497" stroke-width="1.5">
      <rect x="20" y="260" width="160" height="80" rx="5" fill="#edf2f7"/>
      <rect x="220" y="260" width="200" height="80" rx="5" fill="#edf2f7"/>
      <rect x="480" y="170" width="230" height="80" rx="5" fill="#edf2f7"/>
      <rect x="480" y="380" width="230" height="80" rx="5" fill="#edf2f7"/>
      <rect x="770" y="260" width="205" height="80" rx="5" fill="#eaf4ef"/>
      <rect x="220" y="480" width="200" height="70" rx="5" fill="#fff4e6"/>
    </g>
    <g text-anchor="middle" font-size="17">
      <text x="100" y="292">Frage und<tspan x="100" dy="23">Gesprächsverlauf</tspan></text>
      <text x="320" y="292">BFH-Modell wählt<tspan x="320" dy="23">den nächsten Schritt</tspan></text>
      <text x="595" y="203">modul_suche<tspan x="595" dy="24">PDF-Suche + BFH-Antwort</tspan></text>
      <text x="595" y="413">lernzeit<tspan x="595" dy="24">Python rechnet</tspan></text>
      <text x="872" y="292">Executor gibt das<tspan x="872" dy="23">Toolergebnis zurück</tspan></text>
      <text x="320" y="508">Final Answer<tspan x="320" dy="24">Antwort oder Rückfrage</tspan></text>
    </g>
    <g font-size="15" fill="#53677e">
      <text x="437" y="192" text-anchor="end">Dokumentfrage</text>
      <text x="490" y="355">Rechenfrage</text>
      <text x="305" y="399" text-anchor="end">Ergebnis vorhanden</text>
      <text x="305" y="421" text-anchor="end">oder Bezug unklar</text>
      <text x="788" y="363">Observation</text>
    </g>
  </g>
</svg>
