name: Lernnotebooks pruefen
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      bfh_ausfuehren:
        description: Alle Notebooks mit echten BFH-Anfragen ausfuehren
        type: boolean
        default: false
jobs:
  struktur:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
  bfh:
    if: github.event_name == 'workflow_dispatch' && inputs.bfh_ausfuehren
    needs: struktur
    runs-on: windows-latest
    env:
      BFH_API_KEY: ${{ secrets.BFH_API_KEY }}
      BFH_BASE_URL: https://inference.proxy.ti.bfh.ch/v1
      BFH_CHAT_MODEL: qwen3.8-27b
      BFH_EMBEDDING_MODEL: embeddinggemma:300m
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install -e .
      - run: python scripts/run_notebooks.py
